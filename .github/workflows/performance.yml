name: Performance Test

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    if: github.event.pull_request.merged == true

jobs:
  k6-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/k6-action@v0.3.1
        with:
          k6_version: '0.47.0'

      - name: Run performance test (if server available)
        run: |
          if curl -sf http://localhost:8000/health > /dev/null; then
            echo "Server detected, running k6 tests..."
            k6 run --summary-export=results.json backend/tests/performance/load_test.js || true
          else
            echo "No server available, skipping performance test"
            echo '{"status": "skipped", "reason": "no_server"}' > results.json
          fi
        env:
          BASE_URL: http://localhost:8000

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Performance summary
        if: always()
        run: |
          if [ -f results.json ]; then
            echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
            cat results.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file generated"
          fi
