name: Enhanced Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Python依赖审计
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit tools
        run: |
          pip install pip-audit safety
          cd backend && pip install -r requirements.txt

      - name: Check Python dependencies (pip-audit)
        run: |
          cd backend
          pip-audit -r requirements.txt --format=json > pip-audit.json || true
          echo "## pip-audit Results" >> $GITHUB_STEP_SUMMARY
          cat pip-audit.json >> $GITHUB_STEP_SUMMARY || echo "No vulnerabilities found"

      - name: Safety check
        run: |
          cd backend
          safety check --full-report --json > safety-report.json || true
          echo "## Safety Report" >> $GITHUB_STEP_SUMMARY
          cat safety-report.json >> $GITHUB_STEP_SUMMARY || echo "No issues found"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-scans
          path: |
            backend/pip-audit.json
            backend/safety-report.json
          retention-days: 30

  # Node.js依赖审计
  nodejs-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high --json > npm-audit.json || true
          echo "## npm Audit Results" >> $GITHUB_STEP_SUMMARY
          cat npm-audit.json >> $GITHUB_STEP_SUMMARY || echo "No high/critical vulnerabilities"

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-security-scan
          path: frontend/npm-audit.json
          retention-days: 30

  # Snyk扫描（可选，需要SNYK_TOKEN）
  snyk-scan:
    runs-on: ubuntu-latest
    continue-on-error: true  # 如果没有Token则跳过
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python-3.11@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-results.sarif

      - name: Upload Snyk results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-results.sarif
        continue-on-error: true

  # Bandit代码扫描（Python）
  bandit-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install bandit
          cd backend && pip install -r requirements.txt

      - name: Run Bandit security linter
        run: |
          cd backend
          bandit -r app -ll -f json -o bandit-report.json || true
          echo "## Bandit Scan Results" >> $GITHUB_STEP_SUMMARY
          cat bandit-report.json >> $GITHUB_STEP_SUMMARY || echo "No issues found"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-scan
          path: backend/bandit-report.json
          retention-days: 30
