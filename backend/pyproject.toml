[project]
name = "anti-grind-backend"
version = "0.1.0"
description = "Anti-Grind API - 反内卷APP后端服务"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
